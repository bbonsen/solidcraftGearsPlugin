[package]
name = "gears"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Involute spur gear generator plugin for SolidCraft (craft:plugin@0.1.0)"

# Standalone: not part of the SolidCraft workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
